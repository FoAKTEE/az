# match_first_latest_7.cfg -- mission ktg-train, node arxiv-1902.10565::converged_test_7x7
# The fixed-visit closing match of the converged 7x7 test run: the LATEST ACCEPTED net
# against the FIRST EXPORTED net of the same run, 200 games, balanced colours, 7x7.
#
# Derived from this mission's own codes/cfg/match_first_latest_9.cfg by changing exactly
# five keys; the body below is otherwise byte-identical to it, so
# `diff codes/cfg/match_first_latest_9.cfg codes/cfg/match_first_latest_7.cfg` is the
# complete statement of the change:
#
#   bSizes          9   -> 7    7x7 only (bSizeRelProbs = 1, allowRectangleProb = 0 already)
#   numGameThreads  18  -> 12   16 CPUs requested, same budget as selfplay_7x7.cfg
#   numGamesTotal   400 -> 200  the node's brief; 200 games gives a +-3.5 % standard error
#                               on the score fraction, enough to separate a real gain from
#                               zero but small enough to finish inside the 30 min reserved
#                               at the end of the allocation
#   maxVisits       150 -> 100  gatekeeper_7x7.cfg's visit count, so the match measures the
#                               SAME search the gate ran and the same one selfplay trains
#                               under -- not a different, stronger one
#   komiMean        7   -> 9    7x7 area scoring is B+9 with perfect play (9x9 is ~7).
#                               Colours are balanced by construction (see below), so komi
#                               only moves the variance, never the bias -- but a komi the
#                               board cannot produce would make most games one-sided and
#                               waste the sample.
#
# BALANCED COLOURS ARE STRUCTURAL, NOT A KNOB -- unchanged from the 9x9 file. With
# numBots = 2, no `secondaryBots` and no `includeBots`, match.cpp:99-110 emplaces BOTH
# orderings (i,j) and (j,i) into matchupsPerRound and MatchPairer::getMatchup walks that
# round robin (cpp/program/play.cpp:671-700,704-730), so 200 games split 100/100.
#
# THE TWO MODEL PATHS ARE SUPPLIED ON THE COMMAND LINE, never edited into this file:
#   katago match -config codes/cfg/match_first_latest_7.cfg \
#                -override-config "nnModelFile0=<first export>,nnModelFile1=<latest accepted>"
# bot 0 = the FIRST EXPORTED net of the run; bot 1 = the LATEST ACCEPTED net.
# codes/loop/converged_7x7.sbatch does exactly that and records both sha256 sums.

# Logs------------------------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 50
logToStdout = true

# Bots-------------------------------------------------------------------------------------

numBots = 2

botName0 = first
botName1 = latest

# Placeholders. -override-config replaces both; the match refuses to start if it does not,
# because neither path exists.
nnModelFile0 = SET_BY_OVERRIDE_CONFIG_FIRST
nnModelFile1 = SET_BY_OVERRIDE_CONFIG_LATEST

# Match-----------------------------------------------------------------------------------

numGameThreads = 12
numGamesTotal = 200
maxMovesPerGame = 1600

allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 5

# Rules------------------------------------------------------------------------------------

koRules = SIMPLE,POSITIONAL,SITUATIONAL
scoringRules = AREA,TERRITORY
taxRules = NONE,NONE,SEKI,SEKI,ALL
multiStoneSuicideLegals = false,true
hasButtons = false,false,true

bSizes = 7
bSizeRelProbs = 1
allowRectangleProb = 0

komiAuto = false
komiMean = 9
handicapProb = 0.0
handicapCompensateKomiProb = 1.0

# Search limits-----------------------------------------------------------------------------------

maxVisits = 100
numSearchThreads = 1

# GPU Settings-------------------------------------------------------------------------------

nnMaxBatchSize = 128
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 15
numNNServerThreadsPerModel = 1
nnRandomize = true

cudaUseFP16 = auto
cudaUseNHWC = auto

# Root move selection and biases------------------------------------------------------------------------------

chosenMoveTemperatureEarly = 0.5
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.2
chosenMoveSubtract = 0
chosenMovePrune = 1

useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

# Internal params------------------------------------------------------------------------------

winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.00
dynamicScoreUtilityFactor = 0.25
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0
drawEquivalentWinsForWhite = 0.5

rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true

cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.1
valueWeightExponent = 0.5
policyOptimism = 1.0
rootPolicyOptimism = 0.0

subtreeValueBiasFactor = 0.35
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true

useUncertainty = true
uncertaintyExponent = 1.0
uncertaintyCoeff = 0.25

numVirtualLossesPerThread = 1
