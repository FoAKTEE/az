# gatekeeper_7x7.cfg -- mission ktg-train, node arxiv-1902.10565::converged_test_7x7
# Derived from this mission's own codes/cfg/gatekeeper_9x9.cfg (itself upstream's
# cpp/configs/training/gatekeeper1_maxsize9.cfg at v1.18.2) by changing exactly four keys.
# The body below is otherwise byte-identical to gatekeeper_9x9.cfg.
#
#   bSizes             9   -> 7    7x7 only
#   numGameThreads     18  -> 12   16 CPUs requested, same budget as selfplay_7x7.cfg
#   numGamesPerGating  200 -> 80   gatekeeper.cpp:184,188 stops early the moment the
#                                  candidate has 0.5*N win points (accept) or can no
#                                  longer reach them (reject), so N sets both the noise
#                                  floor and the worst-case gate cost. At N = 80 an accept
#                                  needs >= 40 win points, i.e. at least 40 games, and the
#                                  gate costs at most 80 games -- roughly half a cycle's
#                                  selfplay. N = 200 would make the gate the dominant cost
#                                  of a 6-8 min cycle and leave too few cycles to converge.
#                                  requiredCandidateWinProp keeps its upstream default 0.5.
#   maxVisits          150 -> 100  the FULL-search visit count this run's selfplay uses
#                                  (selfplay_7x7.cfg maxVisits = 100). Upstream gates at
#                                  150 against a 600-visit selfplay, i.e. below the search
#                                  the net is trained under; scaling that ratio to this run
#                                  would gate at 25 visits, where a 7x7 result is mostly
#                                  root noise. Gating AT the training search is the
#                                  conservative direction: an acceptance means the
#                                  candidate is better at the visit count it trains at.
#
# The gatekeeper writes no training data, so it carries no dataBoardLen key.
# Do not edit the upstream preset; this file is the mission-owned 7x7 copy.


# Logs------------------------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 10
logToStdout = true

# Fancy game selfplay settings--------------------------------------------------------------------

# startPosesProb = 0.0  # Play this proportion of games starting from SGF positions
# startPosesFromSgfDir = DIRECTORYPATH  # Load SGFs from this dir
# startPosesLoadProb = 1.0  # Only load each position from each SGF with this chance (save memory)
# startPosesTurnWeightLambda = 0  # 0 = equal weight  0.01 = decrease probability by 1% per turn  -0.01 = increase probability by 1% per turn.

# Match-----------------------------------------------------------------------------------

numGameThreads = 12
maxMovesPerGame = 1600
numGamesPerGating = 80

allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 5

# Disabled, since we're not using any root noise and such
# Could have a slight weirdness on rootEndingBonusPoints, but shouldn't be a big deal.
# clearBotBeforeSearch = true

# Rules------------------------------------------------------------------------------------

koRules = SIMPLE,POSITIONAL,SITUATIONAL
scoringRules = AREA,TERRITORY
taxRules = NONE,NONE,SEKI,SEKI,ALL
multiStoneSuicideLegals = false,true
hasButtons = false,false,true

bSizes = 7
bSizeRelProbs = 1
allowRectangleProb = 0

komiAuto = True # Automatically adjust komi to what the neural nets think are fair
#komiMean = 7.5 # Specify explicit komi
handicapProb = 0.0 # Probability of handicap game
handicapCompensateKomiProb = 1.0 # Probability of compensating komi to fair during handicap game
# numExtraBlackFixed = 3  # When playing handicap games, always use exactly this many extra black moves

# Search limits-----------------------------------------------------------------------------------
maxVisits = 100
numSearchThreads = 1

# GPU Settings-------------------------------------------------------------------------------

nnMaxBatchSize = 128
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 15
numNNServerThreadsPerModel = 1
nnRandomize = true

# CUDA GPU settings--------------------------------------
# cudaDeviceToUse = 0 #use device 0 for all server threads (numNNServerThreadsPerModel) unless otherwise specified per-model or per-thread-per-model
# cudaDeviceToUseModel0 = 3 #use device 3 for model 0 for all threads unless otherwise specified per-thread for this model
# cudaDeviceToUseModel1 = 2 #use device 2 for model 1 for all threads unless otherwise specified per-thread for this model
# cudaDeviceToUseModel0Thread0 = 3 #use device 3 for model 0, server thread 0
# cudaDeviceToUseModel0Thread1 = 2 #use device 2 for model 0, server thread 1

cudaUseFP16 = auto
cudaUseNHWC = auto

# Root move selection and biases------------------------------------------------------------------------------

chosenMoveTemperatureEarly = 0.5
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.2
chosenMoveSubtract = 0
chosenMovePrune = 1

useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

# Internal params------------------------------------------------------------------------------

winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.00
dynamicScoreUtilityFactor = 0.25
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0
drawEquivalentWinsForWhite = 0.5

rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true

cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.1
valueWeightExponent = 0.5
policyOptimism = 1.0
rootPolicyOptimism = 0.0

subtreeValueBiasFactor = 0.35
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true

useUncertainty = true
uncertaintyExponent = 1.0
uncertaintyCoeff = 0.25

numVirtualLossesPerThread = 1
