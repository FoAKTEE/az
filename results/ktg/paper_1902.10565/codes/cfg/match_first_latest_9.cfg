# match_first_latest_9.cfg -- mission ktg-train, node arxiv-1902.10565::match_latest_against_first
# P11 of tasks/production_chain_9x9: ONE 1-GPU match, <= 1 h, of the LATEST accepted net
# against the FROZEN FIRST accepted net (codes/eval/freeze_baseline.py's manifest), at
# balanced colours and fixed visits.
#
# Derived from ref-code/lightvector-KataGo/cpp/configs/match_example.cfg at v1.18.2
# (fd0723fdbc0e9d82cf269c9630af8c27c57c07c4). The search block is taken from this
# mission's own codes/cfg/gatekeeper_9x9.cfg so that the match measures the SAME search
# the gate ran, not a different one: identical maxVisits, numSearchThreads, root move
# selection, internal params and rules. Only the match-runner keys differ from the gate.
#
# Keys that differ from match_example.cfg, with the reason:
#   numBots           1        -> 2        two nets play each other
#   botName/nnModelFile        -> per-bot  botName0/1 + nnModelFile0/1 (match.cpp:128-152)
#   numGameThreads    8        -> 18       task section 10; the same budget the gate uses
#   numGamesTotal     1000000  -> 400      P11
#   maxMovesPerGame   1200     -> 1600     gatekeeper_9x9.cfg:33 (9x9 with a long endgame)
#   bSizes            19,13,9  -> 9        o01 / a05_9x9_only
#   bSizeRelProbs     90,5,5   -> 1        arity must match bSizes
#   allowRectangleProb (unset) -> 0        square boards only; match_example has no key,
#                                          and the default is the training preset's 0.5
#   komiAuto          True     -> false    P11 fixes komi, so the two nets cannot be
#   komiMean          (unset)  -> 7        compared at komi they each chose
#   maxVisits         500      -> 150      the gate's visit count (gatekeeper_9x9.cfg:66)
#   nnMaxBatchSize    32       -> 128      18 game threads feeding one GPU
#   nnMutexPoolSizePowerOfTwo 17 -> 15     gatekeeper_9x9.cfg:71
#   logSearchInfo     false    -> false    unchanged, restated: task section 7
#   logGamesEvery     50       -> 50       unchanged
#   resignThreshold   -0.95    -> -0.90    gatekeeper_9x9.cfg:35-36, so a resigned game
#   resignConsecTurns 6        -> 5        ends the same way it does at the gate
#
# BALANCED COLOURS ARE STRUCTURAL, NOT A KNOB. With numBots = 2, no `secondaryBots` and
# no `includeBots`, match.cpp:99-110 emplaces BOTH orderings (i,j) and (j,i) into
# matchupsPerRound, and MatchPairer::getMatchup walks that round robin
# (cpp/program/play.cpp:671-700,704-730). 400 games therefore split 200 / 200 by colour,
# which is what P11 checks. Adding `extraPairs` or `secondaryBots` would break it.
#
# THE TWO MODEL PATHS ARE SUPPLIED ON THE COMMAND LINE, never edited into this file:
#   katago match -config codes/cfg/match_first_latest_9.cfg \
#                -override-config "nnModelFile0=<frozen first>,nnModelFile1=<latest>" \
#                -sgf-output-dir <eval>/match -log-file <eval>/match.log
# (commandline.cpp:253). codes/eval/match.sbatch does exactly that, reading the frozen
# path out of the manifest, so the config stays a constant while the nets move and the
# frozen baseline can never be silently swapped by an edit here.
#
# bot 0 = the FROZEN FIRST accepted net; bot 1 = the LATEST accepted net.
# codes/eval/declare.py reads the sgf PB/PW names, so these two names are part of the
# contract: --bot-first first, --bot-latest latest.

# Logs------------------------------------------------------------------------------------

logSearchInfo = false
logMoves = false
logGamesEvery = 50
logToStdout = true

# Bots-------------------------------------------------------------------------------------

numBots = 2

botName0 = first
botName1 = latest

# Placeholders. -override-config replaces both; the match refuses to start if it does not,
# because neither path exists.
nnModelFile0 = SET_BY_OVERRIDE_CONFIG_FIRST
nnModelFile1 = SET_BY_OVERRIDE_CONFIG_LATEST

# Match-----------------------------------------------------------------------------------

numGameThreads = 18
numGamesTotal = 400
maxMovesPerGame = 1600

allowResignation = true
resignThreshold = -0.90
resignConsecTurns = 5

# Rules------------------------------------------------------------------------------------

koRules = SIMPLE,POSITIONAL,SITUATIONAL
scoringRules = AREA,TERRITORY
taxRules = NONE,NONE,SEKI,SEKI,ALL
multiStoneSuicideLegals = false,true
hasButtons = false,false,true

bSizes = 9
bSizeRelProbs = 1
allowRectangleProb = 0

komiAuto = false
komiMean = 7
handicapProb = 0.0
handicapCompensateKomiProb = 1.0

# Search limits-----------------------------------------------------------------------------------

maxVisits = 150
numSearchThreads = 1

# GPU Settings-------------------------------------------------------------------------------

nnMaxBatchSize = 128
nnCacheSizePowerOfTwo = 21
nnMutexPoolSizePowerOfTwo = 15
numNNServerThreadsPerModel = 1
nnRandomize = true

cudaUseFP16 = auto
cudaUseNHWC = auto

# Root move selection and biases------------------------------------------------------------------------------

chosenMoveTemperatureEarly = 0.5
chosenMoveTemperatureHalflife = 19
chosenMoveTemperature = 0.2
chosenMoveSubtract = 0
chosenMovePrune = 1

useLcbForSelection = true
lcbStdevs = 5.0
minVisitPropForLCB = 0.15

# Internal params------------------------------------------------------------------------------

winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.00
dynamicScoreUtilityFactor = 0.25
dynamicScoreCenterZeroWeight = 0.25
dynamicScoreCenterScale = 0.50
noResultUtilityForWhite = 0.0
drawEquivalentWinsForWhite = 0.5

rootEndingBonusPoints = 0.5
rootPruneUselessMoves = true

cpuctExploration = 1.1
cpuctExplorationLog = 0.0
fpuReductionMax = 0.2
rootFpuReductionMax = 0.1
valueWeightExponent = 0.5
policyOptimism = 1.0
rootPolicyOptimism = 0.0

subtreeValueBiasFactor = 0.35
subtreeValueBiasWeightExponent = 0.8
useNonBuggyLcb = true
useGraphSearch = true

useUncertainty = true
uncertaintyExponent = 1.0
uncertaintyCoeff = 0.25

numVirtualLossesPerThread = 1
